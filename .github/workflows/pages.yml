name: Deploy Pages Demo

# 把单文件版发布为 GitHub Pages 在线试用站点。
# 注意：所有处理仍在用户浏览器本地完成；Pages 仅托管静态 HTML，不接收任何文件。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare demo site
        run: |
          mkdir -p _site
          cp "PDF页面提取器-单文件版.html" _site/index.html
          cp -r lib icons assets sw.js manifest.webmanifest 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
