name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build single-file HTML
        run: python tools/build_single.py

      - name: Prepare ASCII-named asset
        run: cp "PDF页面提取器-单文件版.html" pdf-page-extractor.html

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pdf-page-extractor.html
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
